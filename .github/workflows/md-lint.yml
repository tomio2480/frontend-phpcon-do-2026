name: Markdown Lint

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Markdown Lint via composite action
        uses: tomio2480/github-workflows/.github/actions/markdown-lint@0ca7feedc1a9f9830a53959550889e3860701b53 # v2.5.13
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
